<section class="search-section">
  <input
    type="text"
    id="search"
    placeholder="Inserisci il tuo codice candidato"
    autocomplete="off"
  />
</section>

<section class="stats-grid">

  <div class="stat">
    <span class="stat-label">Candidati</span>
    <span class="stat-value" id="totale-candidati">-</span>
  </div>

  <div class="stat">
    <span class="stat-label">Media scritta</span>
    <span class="stat-value" id="media-scritta">-</span>
  </div>

  <div class="stat">
    <span class="stat-label">Media pratica</span>
    <span class="stat-value" id="media-pratica">-</span>
  </div>

  <div class="stat">
    <span class="stat-label">Media orale</span>
    <span class="stat-value" id="media-orale">-</span>
  </div>

  <div class="stat">
    <span class="stat-label">Colloqui pubblicati</span>
    <span class="stat-value" id="orali-pubblicati">-</span>
  </div>

</section>

<section class="table-wrapper">
  <table>
    <thead>
      <tr>
        <th>Pos.</th>
        <th>Codice</th>
        <th>Scritta</th>
        <th>Pratica</th>
        <th>Orale</th>
        <th>Totale</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</section>

<section class="pagination">
  <button id="prev">⬅️ Indietro</button>
  <span id="page-info"></span>
  <button id="next">Avanti ➡️</button>
</section>

<script src="graduatoria.js"></script>
